<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#090d19">
  <meta name="description" content="EventFlow Studio is an interactive, safe portfolio demonstration of fictional event planning, crew coordination, and financial reporting.">
  <title>EventFlow Studio — Live Production Management Demo</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./studio.css?build=20261017-2">
  <style>
    html,body{min-height:100%;margin:0;background:#090d19;color:#f2f5ff;font-family:system-ui,sans-serif}
    #boot{max-width:480px;margin:17vh auto;padding:30px;text-align:center}
    #boot strong{font-size:27px;letter-spacing:-.8px}
    #boot strong span{color:#fc746e}
    #boot p{color:#98a6bc;font-size:13px;line-height:1.7}
    .boot-orb{height:44px;width:44px;margin:0 auto 19px;background:linear-gradient(130deg,#fc8a75,#ef5267);border-radius:13px;box-shadow:0 0 40px #f35a6a44}
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">
      <div class="boot-orb"></div>
      <strong>Event<span>Flow</span> Studio</strong>
      <p>Launching your interactive production workspace…</p>
      <p>Public portfolio demo · Fictional data only · No company connections</p>
    </div>
  </div>
  <noscript><p style="text-align:center">JavaScript is required for this interactive demonstration.</p></noscript>
  <script src="./studio.js?build=20261017-2" defer></script>
  <script>
    window.addEventListener('load', function () {
      if (window.__eventflowReady) return;
      var boot = document.getElementById('boot');
      if (boot) boot.innerHTML =
        '<strong>Event<span>Flow</span> Studio</strong>' +
        '<p>We could not start the interactive demo. Try a hard refresh (Ctrl + F5). If it still fails, check whether studio.js was blocked in the browser console.</p>' +
        '<p><a href="https://github.com/vicentektek/eventflow-demo" style="color:#ff9d92">View source on GitHub</a></p>';
    });
  </script>
</body>
</html>
